# Publicação do Truco de Turing no Firebase Hosting.
#
# Roda depois que o workflow "Versão" termina com sucesso na main (ou seja, depois que o robô
# subiu a versão e gerou o dist/), e também pode ser disparado à mão na aba Actions.
# Empacota o jogo de novo a partir da main mais recente e publica dist/truco-de-turing.html
# no canal "live" do projeto truco-e26e8-703bc (https://truco-e26e8-703bc.web.app e o domínio próprio).
#
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (JSON da conta de serviço) em
# Settings → Secrets and variables → Actions.
name: Deploy

on:
  workflow_run:
    workflows: [Versão]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Regras do Firestore (firestore.rules): o painel de conquistas globais depende da coleção
      # `placar`. Roda antes do site, com a mesma conta de serviço; se ela não tiver permissão para
      # publicar regras (papel "Firebase Rules Admin"), o site sobe mesmo assim e o aviso aponta o
      # passo manual: Firestore > Regras, no console do Firebase, colando firestore.rules.
      - name: Publicar as regras do Firestore
        env:
          CONTA_DE_SERVICO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CONTA_DE_SERVICO" > "$RUNNER_TEMP/conta-de-servico.json"
          if GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta-de-servico.json" npx --yes firebase-tools@15 deploy --only firestore:rules --project truco-e26e8-703bc --non-interactive; then
            echo "Regras do Firestore publicadas."
          else
            echo "::warning title=Regras do Firestore::Não foi possível publicar firestore.rules por aqui. Publique à mão em Firestore > Regras (console do Firebase) ou dê o papel Firebase Rules Admin à conta de serviço."
          fi
          rm -f "$RUNNER_TEMP/conta-de-servico.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: truco-e26e8-703bc
          channelId: live
