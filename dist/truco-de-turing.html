<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- empacotar:cabecalho -->
<title>Truco de Turing</title>
<meta name="description" content="Jogo de cartas para aprender redes neurais e deep learning, com alma de truco e Magic: The Gathering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
<style>
/**
 * Estilo dos painéis HTML do Truco de Turing (menu, regras, grimório, conquistas, sobre, avisos).
 * A mesa em si é desenhada pelo Phaser no canvas; aqui ficam só as telas sobrepostas.
 *
 * Paleta: mesa de truco à noite (feltro verde, latão, pergaminho) e as cores azul/laranja
 * do TensorFlow Playground para as duas redes.
 */
:root {
  /* layout: canvas do Phaser ocupando a tela + painéis HTML sobrepostos para menus e regras */
  --feltro: #0f3b2a;
  --feltro-escuro: #08241a;
  --madeira: #22130a;
  --latao: #d9b260;
  --latao-suave: #a88843;
  --pergaminho: #efe3c6;
  --pergaminho-escuro: #d9c7a0;
  --tinta: #24170c;
  --azul: #4aa3df;
  --laranja: #f59322;
  --vinho: #7a1626;
  --fonte-titulo: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --fonte-texto: 'Spectral', Georgia, 'Times New Roman', serif;
  --fonte-interface: 'Spectral', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, #12382a 0%, #071810 70%, #040c08 100%);
  background-color: var(--feltro-escuro);
  color: var(--pergaminho);
  font-family: var(--fonte-interface);
  font-variant-numeric: lining-nums;
  overflow: hidden;
}
/* O Phaser mede o contêiner com getBoundingClientRect (que inclui padding): por isso as áreas
 * seguras (entalhe, barra de gestos) entram como posição, nunca como padding. */
#jogo {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  overflow: hidden;
}
#jogo canvas { display: block; touch-action: none; }
html, body { overscroll-behavior: none; }

/* ---------- Painéis sobrepostos ---------- */
#paineis { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.camada {
  position: absolute; inset: 0;
  display: flex; overflow-y: auto;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(4, 10, 7, 0.72);
  pointer-events: auto;
  animation: surgir 0.18s ease-out;
}
.camada > * { margin: auto; }
.camada.transparente { background: transparent; }
@keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { transform: translateY(14px); opacity: 0.4; } to { transform: none; opacity: 1; } }

.folha {
  position: relative;
  width: min(880px, 100%);
  max-height: 100%;
  overflow: auto;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 120px),
    var(--pergaminho);
  color: var(--tinta);
  border: 3px solid #0d0a08;
  outline: 2px solid var(--latao);
  outline-offset: -9px;
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  padding: 28px 30px 26px;
  font-family: var(--fonte-texto);
  font-size: 17px;
  line-height: 1.5;
  animation: subir 0.22s ease-out;
}
.folha.estreita { width: min(520px, 100%); }
.folha h1, .folha h2, .folha h3 { font-family: var(--fonte-titulo); text-wrap: balance; color: #2b1608; margin: 0; }
.folha h2 { font-size: 28px; letter-spacing: 0.02em; }
.folha h3 { font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 18px; color: #6b1a22; }
.folha p { margin: 8px 0; max-width: 68ch; }
.folha ul { margin: 6px 0; padding-left: 20px; }
.folha li { margin: 3px 0; }
.folha kbd, .selo {
  display: inline-block; font-family: var(--fonte-interface); font-weight: 700; font-size: 13px;
  padding: 1px 8px; border-radius: 999px; background: #2b1608; color: var(--pergaminho);
}
.selo.azul { background: #1f5f8a; }
.selo.laranja { background: #a8580c; }
.fechar-x {
  position: absolute; top: 12px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid #2b1608; background: transparent; color: #2b1608;
  font: 700 20px var(--fonte-interface); cursor: pointer;
}
.fechar-x:hover { background: #2b1608; color: var(--pergaminho); }

.botao {
  font-family: var(--fonte-titulo); font-weight: 700; letter-spacing: 0.06em;
  font-size: 16px; padding: 11px 20px; border-radius: 10px; cursor: pointer;
  border: 2px solid #0d0a08;
  background: linear-gradient(180deg, #f3d488, #c79a3a);
  color: #24140a;
  box-shadow: 0 3px 0 #6b4a12, 0 8px 18px rgba(0, 0, 0, 0.35);
  transition: transform 0.08s ease, filter 0.15s ease;
}
.botao:hover { filter: brightness(1.08); }
.botao:active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4a12; }
.botao.vinho { background: linear-gradient(180deg, #b0303d, #6e1420); color: #ffe9d6; box-shadow: 0 3px 0 #3a0a10, 0 8px 18px rgba(0, 0, 0, 0.35); }
.botao.discreto { background: transparent; color: #2b1608; box-shadow: none; }
.botao.pequeno { font-size: 13px; padding: 7px 12px; }
.botao:focus-visible, select:focus-visible, .grimorio-lista button:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
/* janelas REGRAS e MENU da mesa: botões grandes, quase quadrados, em grade 2×2 */
.janela-da-mesa { width: min(440px, 100%); }
.grade-de-botoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.grade-de-botoes .botao { min-height: 72px; padding: 10px 8px; font-size: 17px; }
.grade-de-botoes .botao.discreto { border-color: rgba(43, 22, 8, 0.45); }
@media (max-height: 520px) {
  .janela-da-mesa p { display: none; }
  .grade-de-botoes .botao { min-height: 60px; }
}
.linha.fim { justify-content: flex-end; }

/* ---------- Menu ---------- */
.menu {
  width: min(1040px, 100%);
  margin: auto; /* centraliza na tela, na horizontal e na vertical */
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 22px;
  align-items: center;
}
.menu-capa { display: flex; flex-direction: column; justify-content: center; gap: 14px; color: var(--pergaminho); min-width: 0; }
.menu-capa h1 {
  font-family: var(--fonte-titulo); font-weight: 900; margin: 0;
  /* tudo em maiúsculas: na Cinzel as minúsculas viram versaletes e as iniciais ficavam maiores */
  text-transform: uppercase;
  font-size: clamp(36px, 5.4vw, 70px); line-height: 1; letter-spacing: 0.04em;
  color: #f6dc8f;
  text-shadow: 0 2px 0 #6b4a12, 0 4px 0 #3d2a08, 0 18px 40px rgba(0, 0, 0, 0.6);
  text-wrap: balance;
}
.menu-capa p { font-family: var(--fonte-texto); font-size: 19px; line-height: 1.45; max-width: 46ch; margin: 0; color: #e9dcbc; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: #cdbf9e; }
.legenda b { color: var(--pergaminho); }
.ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.menu-acoes { display: grid; gap: 10px; margin-top: 6px; max-width: 520px; }
.menu-acoes .botao.jogar { font-size: 20px; padding: 12px 20px; letter-spacing: 0.12em; }
.menu-mais { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px; }
/* os seis botões têm o mesmo tamanho: colunas e linhas iguais, conteúdo centrado, e o retrato do
   Avatar não aumenta a altura do botão (margem negativa compensa o tamanho dele) */
.menu-mais .botao { font-size: 13px; padding: 9px 6px; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu-mais .botao-avatar img { width: 1.9em; height: 1.9em; margin-block: -0.5em; flex: none; }
@media (max-width: 520px) { .menu-mais { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.menu-painel { padding: 22px 24px; }
.campo { display: grid; gap: 4px; margin-bottom: 12px; }
.campo label { font-family: var(--fonte-interface); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b1a22; }
.campo select {
  font: 600 16px var(--fonte-interface); color: var(--tinta);
  background: #fbf4e2; border: 2px solid #2b1608; border-radius: 8px; padding: 8px 10px; width: 100%;
}
.campo .dica { font-size: 14px; color: #5a4630; line-height: 1.35; min-width: 0; }
/* dois campos curtos lado a lado (jogadores e humanos; arquitetura e baralhos; início e partida) */
.campos-duplos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.campo[hidden] { display: none; }
.dica-da-mesa { font-size: 13px; color: #5a4630; line-height: 1.3; margin: -6px 0 12px; }
#m-oponente-dica { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.menu-painel { max-height: calc(100dvh - 24px); overflow-y: auto; }
/* seletor com a miniatura (verso do baralho, mesa do terreno) ao lado, na mesma linha */
.campo-linha { display: flex; gap: 10px; align-items: center; }
.campo-linha select { flex: 1; min-width: 0; }
/* caixa de largura fixa: os dois seletores terminam no mesmo ponto e a miniatura fica centralizada */
.campo-linha .miniatura { margin-inline: calc((66px - var(--largura-miniatura)) / 2); }
.miniatura { flex: none; display: block; border-radius: 5px; overflow: hidden; border: 1.5px solid #2b1608; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); background: #2b1608; }
.miniatura img { display: block; width: 100%; height: 100%; object-fit: cover; }
.miniatura.verso { --largura-miniatura: 30px; width: 30px; height: 42px; border: 0; border-radius: 3px; background: transparent; }
.miniatura.mesa { --largura-miniatura: 66px; width: 66px; height: 38px; }
.creditos { font-size: 13px; color: #a8987a; line-height: 1.4; }
.creditos a { color: var(--latao); }

/* ---------- Grimório ---------- */
.grimorio { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; margin-top: 14px; }
.grimorio-lista { display: grid; gap: 4px; align-content: start; }
.grimorio-lista button {
  text-align: left; font: 600 15px var(--fonte-interface); color: var(--tinta);
  background: transparent; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.grimorio-lista button[aria-current='true'] { background: #2b1608; color: var(--pergaminho); }
.grimorio-lista button .lido { font-size: 11px; color: #8a6d3a; margin-left: 6px; }
.grimorio-verbete { min-width: 0; }
.grimorio-verbete .categoria { font: 700 12px var(--fonte-interface); letter-spacing: 0.16em; text-transform: uppercase; color: #6b1a22; }
.grimorio-verbete .no-jogo { border-left: 4px solid var(--azul); background: rgba(74, 163, 223, 0.1); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.grimorio-verbete .equacao { margin: 12px 0; padding: 10px 12px; background: rgba(255, 248, 230, 0.7); border: 1px solid rgba(60, 40, 20, 0.15); border-radius: 8px; overflow-x: auto; font-size: 18px; color: #2b1608; }
.grimorio-verbete .equacao math { font-size: 1.05em; }
.grimorio-verbete .equacao math + math { margin-top: 10px; }
.grimorio-verbete .figura { margin: 10px 0; }
.grimorio-verbete .figura-svg { width: 100%; max-width: 480px; height: auto; display: block; margin: 0 auto; }
.grimorio-verbete .limite { border-left: 4px solid #c8742a; background: rgba(200, 116, 42, 0.1); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.grimorio-verbete .fonte { font-size: 13px; color: #6b5a40; font-style: italic; }

/* ---------- Conquistas ---------- */
.folha.larga { width: min(1060px, 100%); }
.conquistas-salao { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.guilda { text-align: center; position: sticky; top: 0; }
.guilda .retrato { aspect-ratio: 240 / 330; max-width: 230px; margin: 0 auto; }
.guilda .retrato canvas { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
.guilda-nota { font-style: italic; font-size: 14px; color: #5a4630; margin: 6px auto 0; max-width: 26ch; }
.conquistas-principal { min-width: 0; }
.conquistas-resumo { color: #5a4630; }
.conquistas-resumo b { font-family: var(--fonte-titulo); font-size: 20px; color: #6b1a22; }
.conquistas-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.conquista {
  display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center;
  padding: 10px; border-radius: 10px; border: 1px solid rgba(43, 22, 8, 0.25); background: rgba(255, 255, 255, 0.38);
}
.medalha {
  position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 55%), var(--graduacao);
  border: 2px solid #24140a; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.25);
}
.medalha > svg { width: 38px; height: 38px; }
.medalha .cadeado { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: #efe3c6; border: 1.5px solid #24140a; display: grid; place-items: center; }
.medalha .cadeado svg { width: 16px; height: 16px; }
.conquista.bloqueada .medalha { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%), #c9bc9f; }
.conquista.bloqueada .medalha > svg { filter: grayscale(1); opacity: 0.4; }
.conquista.bloqueada b, .conquista.bloqueada .graduacao { opacity: 0.65; }
.conquista b { display: block; font-family: var(--fonte-interface); font-size: 15px; }
.conquista small { display: block; font-family: var(--fonte-interface); font-size: 13px; color: #5a4630; line-height: 1.3; }
.conquista .graduacao { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b1a22; font-weight: 700; }
.conquistas-rodape { font-size: 13px; color: #7a6a4c; margin-top: 12px; }
.desbloqueio .medalha { width: 38px; height: 38px; flex: none; }
.desbloqueio .medalha > svg { width: 26px; height: 26px; }
.folha.sobre h3:first-of-type { margin-top: 14px; }
.folha.sobre a { color: #7a1626; }
.folha.sobre .versao { margin-top: -6px; font-family: var(--fonte-interface); font-size: 13px; letter-spacing: 0.04em; color: #7a6a4c; }
.folha.sobre .autores { margin-bottom: 0; }
.folha.sobre .contribuicoes { font-size: 13px; font-style: italic; color: #7a6a4c; margin-top: 10px; }

/* ---------- Mods ---------- */
.tipos-de-mod { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tipo-de-mod { background: rgba(255, 255, 255, 0.45); border: 1px solid #c9b48a; border-radius: 8px; padding: 10px 12px; }
.tipo-de-mod h4 { margin: 0 0 4px; font-family: var(--fonte-titulo); color: #6b1a22; }
.tipo-de-mod p { margin: 0 0 6px; font-size: 14px; }
.tipo-de-mod .campos { font-size: 13px; color: #5a4630; }
.codigo-mod { background: #1c140c; color: #f3e6c4; border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; max-height: 320px; }
.mods-copiado { margin-left: 10px; font-size: 14px; color: #3f6b2e; }
.arquivos-de-mods li { margin-bottom: 4px; }
.mods a { color: #1d4f7a; }
.mods a code { color: inherit; }
.aviso-mods { background: #f9eeda; border-left: 4px solid #c99a3a; padding: 8px 12px; border-radius: 4px; }
@media (max-width: 760px) { .tipos-de-mod { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Fim de mão ---------- */
.resultado-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
/* 3 a 5 jogadores: redes em colunas mais estreitas, que quebram linha quando não cabem */
.resultado-grade.varios { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.resultado-grade.varios .total { font-size: 30px; }
.rede { border-radius: 10px; padding: 12px 14px; background: rgba(255, 255, 255, 0.4); border-top: 6px solid var(--azul); min-width: 0; }
.rede.j1 { border-top-color: var(--laranja); }
.rede.j2 { border-top-color: #5cc98a; }
.rede.j3 { border-top-color: #b48cff; }
.rede.j4 { border-top-color: #ff6fb1; }
.rede .total { font: 900 40px var(--fonte-titulo); line-height: 1; }
.rede .situacao { font: 700 12px var(--fonte-interface); letter-spacing: 0.14em; text-transform: uppercase; color: #6b1a22; }
.termos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.termo { font: 600 13px var(--fonte-interface); background: #fbf4e2; border: 1px solid #c9b48a; border-radius: 6px; padding: 2px 7px; }
.termo.combo { background: #2b1608; color: #f6dc8f; border-color: #2b1608; }
.termo.ruim { background: #6e1420; color: #ffe1d6; border-color: #6e1420; }
.tentos { font: 700 18px var(--fonte-interface); margin-top: 12px; }
.tentos .grande { font: 900 30px var(--fonte-titulo); }
.desbloqueios { margin-top: 10px; display: grid; gap: 6px; }
.desbloqueio { display: flex; gap: 10px; align-items: center; font: 600 15px var(--fonte-interface); }

/* ---------- Truco ---------- */
.grito-truco { text-align: center; }
.grito-truco .grito {
  font: 900 64px var(--fonte-titulo); color: #8a1222; letter-spacing: 0.04em; line-height: 1;
  text-shadow: 0 3px 0 #f6dc8f;
}
.grito-truco .quem { font: 700 14px var(--fonte-interface); letter-spacing: 0.2em; text-transform: uppercase; color: #6b1a22; }
.grito-truco .linha { justify-content: center; margin-top: 16px; }

/* ---------- Avisos rápidos ---------- */
#avisos {
  position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: grid; gap: 6px; z-index: 9; pointer-events: none; width: min(440px, calc(100% - 32px));
}
.aviso {
  pointer-events: auto;
  background: var(--pergaminho); color: var(--tinta); border: 2px solid #0d0a08; border-radius: 10px;
  padding: 8px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); font-family: var(--fonte-texto); font-size: 14px; line-height: 1.35;
  animation: subir 0.25s ease-out;
}
.aviso b { font-family: var(--fonte-titulo); font-size: 14px; display: block; color: #6b1a22; letter-spacing: 0.04em; }
.aviso.medalha-aviso { border-color: var(--latao); background: #2b1608; color: #f6dc8f; }
.aviso.medalha-aviso b { color: var(--latao); }
.aviso.dica-de-jogo { border-color: var(--latao); }
.aviso.dica-de-jogo .conceito { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(60, 40, 20, 0.35); font-size: 13px; color: #4b3a26; }

/* ---------- Vitória: tela de resultado em festa ---------- */
.folha.vitoria {
  border-color: var(--latao);
  box-shadow: 0 0 0 3px rgba(217, 178, 96, 0.55), 0 0 60px rgba(246, 220, 143, 0.45), 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: surgir 0.3s ease-out, brilhar-vitoria 2.4s ease-in-out infinite;
}
.folha.vitoria h2 {
  font-size: clamp(26px, 4vw, 38px); text-align: center;
  background: linear-gradient(180deg, #fff1b8 0%, #e7b23a 45%, #8a5a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(58, 36, 6, 0.6));
}
.folha.vitoria > p:first-of-type { text-align: center; }
.folha.campeao h2 { font-size: clamp(28px, 4.6vw, 44px); }
.trofeu { display: flex; justify-content: center; margin: -4px 0 2px; animation: pulo-trofeu 1.2s ease-in-out infinite; }

    corpo += '<circle cx="240" cy="95" r="28" fill="#fff8e6" stroke="' + TINTA2 + '" stroke-width="1.5"/><text x="240" y="101" text-anchor="middle" style="font-size:20px">\u03A3</text><text x="240" y="146" text-anchor="middle" class="p">+ vi\xE9s b</text><line x1="268" y1="95" x2="318" y2="95" stroke="' + TINTA2 + '" stroke-width="1.5"/><rect x="318" y="72" width="64" height="46" rx="8" fill="#fff8e6" stroke="' + TINTA2 + '" stroke-width="1.5"/>' + traco([[326, 108], [350, 108], [374, 80]], VINHO, 2) + '<text x="350" y="134" text-anchor="middle" class="p">ativa\xE7\xE3o \u03C6</text><line x1="382" y1="95" x2="440" y2="95" stroke="' + TINTA2 + '" stroke-width="1.5" marker-end="url(#seta)"/><text x="452" y="100">y</text><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + TINTA2 + '"/></marker></defs>';
    return svg2(480, 180, "Diagrama de um neur\xF4nio: entradas multiplicadas por pesos, somadas com o vi\xE9s e passadas pela ativa\xE7\xE3o", corpo);

  function ativacoes() {
    const painel = (dx, nome, f, cor) => {
      const tela = (x, y) => [dx + 20 + (x + 4) / 8 * 120, 110 - y * 40];
      return '<line x1="' + (dx + 20) + '" y1="110" x2="' + (dx + 140) + '" y2="110" stroke="' + CINZA + '"/><line x1="' + (dx + 80) + '" y1="20" x2="' + (dx + 80) + '" y2="150" stroke="' + CINZA + '"/>' + traco(amostrar(f, -4, 4, 60, tela), cor, 2.5) + '<text x="' + (dx + 80) + '" y="172" text-anchor="middle">' + nome + "</text>";
    };
    return svg2(
      480,
      180,
      "Gr\xE1ficos das ativa\xE7\xF5es ReLU, sigmoide e tangente hiperb\xF3lica",
      painel(0, "ReLU", (x) => Math.min(2.2, Math.max(0, x) / 2), VINHO) + painel(160, "sigmoide", (x) => 1 / (1 + Math.exp(-x)), AZUL) + painel(320, "tanh", (x) => Math.tanh(x), LARANJA)
    );
  }
  function rede() {
    const camadas = [3, 5, 5, 4], xs = [50, 170, 290, 410];
    const ys = (n) => Array.from({ length: n }, (_, i) => 95 + (i - (n - 1) / 2) * 34);
    let corpo = "";
    for (let c = 0; c < camadas.length - 1; c++) {
      for (const y0 of ys(camadas[c])) for (const y1 of ys(camadas[c + 1])) corpo += '<line x1="' + xs[c] + '" y1="' + y0 + '" x2="' + xs[c + 1] + '" y2="' + y1 + '" stroke="' + CINZA + '" stroke-width="0.6" opacity="0.6"/>';
    }
    const caminho = [1, 3, 0, 2].map((i, c) => [xs[c], ys(camadas[c])[i]]);
    corpo += traco(caminho, AZUL, 4);
    camadas.forEach((n, c) => ys(n).forEach((y) => {
      corpo += '<circle cx="' + xs[c] + '" cy="' + y + '" r="10" fill="#fff8e6" stroke="' + TINTA2 + '"/>';
    }));
    caminho.forEach(([x, y]) => {
      corpo += '<circle cx="' + x + '" cy="' + y + '" r="10" fill="' + AZUL + '"/>';
    });
    ["entrada", "oculta", "oculta", "sa\xEDda"].forEach((r, c) => {
      corpo += '<text x="' + xs[c] + '" y="190" text-anchor="middle" class="p">' + r + "</text>";
    });
    return svg2(460, 200, "Rede densa com todas as liga\xE7\xF5es em cinza e, em azul, o caminho de um neur\xF4nio por camada que o jogo usa", corpo);
  }
  function curvas() {
    const tela = (x, y) => [50 + x * 40, 30 + (1 - y) * 120];
    const treino = (t) => 0.9 * Math.exp(-t / 2.2) + 0.08;
    const validacao = (t) => 0.9 * Math.exp(-t / 2.2) + 0.14 + 0.012 * Math.max(0, t - 4.2) ** 2;
    const parada = tela(4.2, validacao(4.2));
    return svg2(
      480,
      190,
      "Curvas de perda: a de treino cai sempre; a de valida\xE7\xE3o cai, para e volta a subir; a parada antecipada fica no m\xEDnimo da valida\xE7\xE3o",
      eixos(50, 20, 470, 150, "\xE9pocas", "perda") + traco(amostrar(treino, 0, 10, 60, tela), AZUL, 2.5) + traco(amostrar(validacao, 0, 10, 60, tela), LARANJA, 2.5) + '<line x1="' + parada[0] + '" y1="20" x2="' + parada[0] + '" y2="150" stroke="' + VINHO + '" stroke-dasharray="5 4"/><text x="' + (parada[0] + 6) + '" y="34" style="fill:' + VINHO + '">parar aqui</text><text x="470" y="140" text-anchor="end" style="fill:' + AZUL + '">treino</text><text x="470" y="' + (tela(10, validacao(10))[1] + 16) + '" text-anchor="end" style="fill:' + LARANJA + '">valida\xE7\xE3o</text>'
    );
  }
  function sobreajuste() {
    const pontos = [[0.5, 0.35], [1.4, 0.62], [2.2, 0.5], [3.1, 0.82], [4, 0.7], [4.8, 1.02], [5.7, 0.9], [6.5, 1.18], [7.4, 1.06], [8.2, 1.35]];
    const tela = (x, y) => [50 + x * 48, 160 - y * 100];
    const suave = (x) => 0.32 + 0.12 * x;
    const decorada = (x) => pontos.reduce((s, [xi, yi], i) => s + yi * pontos.reduce((p, [xj], j) => j === i ? p : p * (x - xj) / (xi - xj), 1), 0);
    let corpo = eixos(50, 20, 470, 170, "x", "y") + traco(amostrar(suave, 0.3, 8.4, 40, tela), AZUL, 2.5) + traco(amostrar((x) => Math.max(-0.05, Math.min(1.55, decorada(x))), 0.5, 8.2, 220, tela), LARANJA, 2);
    pontos.forEach(([x, y]) => {
      const [a, b] = tela(x, y);
      corpo += '<circle cx="' + a + '" cy="' + b + '" r="4.5" fill="' + TINTA2 + '"/>';
    });
    corpo += '<text x="60" y="34" style="fill:' + AZUL + '">generaliza</text><text x="60" y="52" style="fill:' + LARANJA + '">decora o ru\xEDdo</text>';
    return svg2(480, 190, "Dez pontos com ru\xEDdo: uma reta que segue a tend\xEAncia e uma curva que passa por todos os pontos e oscila", corpo);
  }
  function dropout2() {
    const camadas = [3, 5, 5, 2], xs = [50, 170, 290, 410];
    const ys = (n) => Array.from({ length: n }, (_, i) => 95 + (i - (n - 1) / 2) * 34);
    const desligado = { "1:1": 1, "1:4": 1, "2:0": 1, "2:3": 1 };
    let corpo = "";
    for (let c = 0; c < camadas.length - 1; c++) {
      ys(camadas[c]).forEach((y0, i) => ys(camadas[c + 1]).forEach((y1, j) => {
        if (desligado[c + ":" + i] || desligado[c + 1 + ":" + j]) return;
        corpo += '<line x1="' + xs[c] + '" y1="' + y0 + '" x2="' + xs[c + 1] + '" y2="' + y1 + '" stroke="' + AZUL + '" stroke-width="0.9" opacity="0.7"/>';
      }));
    }
    camadas.forEach((n, c) => ys(n).forEach((y, i) => {
      const fora = desligado[c + ":" + i];
      corpo += '<circle cx="' + xs[c] + '" cy="' + y + '" r="10" fill="' + (fora ? "#e8dcc0" : "#fff8e6") + '" stroke="' + (fora ? CINZA : TINTA2) + '"' + (fora ? ' stroke-dasharray="3 2"' : "") + "/>";
      if (fora) corpo += '<path d="M' + (xs[c] - 6) + "," + (y - 6) + " L" + (xs[c] + 6) + "," + (y + 6) + " M" + (xs[c] + 6) + "," + (y - 6) + " L" + (xs[c] - 6) + "," + (y + 6) + '" stroke="' + VINHO + '" stroke-width="2"/>';
    }));
    corpo += '<text x="230" y="190" text-anchor="middle" class="p">a cada passo do treino, um sorteio novo de neur\xF4nios desligados</text>';
    return svg2(460, 200, "Rede com quatro neur\xF4nios ocultos desligados por dropout e as liga\xE7\xF5es deles removidas", corpo);
  }
  function vanishing() {
    let corpo = eixos(50, 20, 470, 160, "camada (da sa\xEDda para a entrada)", "gradiente");
    for (let k = 0; k < 8; k++) {
      const g = Math.pow(0.25, k * 0.55), a = 130 * g, x = 70 + k * 50;
      corpo += '<rect x="' + x + '" y="' + (160 - a) + '" width="30" height="' + Math.max(1, a) + '" fill="' + (k ? AZUL : VINHO) + '" opacity="' + (1 - k * 0.07) + '"/><text x="' + (x + 15) + '" y="176" text-anchor="middle" class="p">' + (k ? "L\u2212" + k : "L") + "</text>";
    }
    return svg2(480, 190, "Barras que encolhem a cada camada: o gradiente perde for\xE7a ao voltar da sa\xEDda para a entrada", corpo);
  }
  var FIGURAS = { neuronio, ativacoes, rede, curvas, sobreajuste, dropout: dropout2, vanishing };

  function abrirGrimorio(app, idInicial, aoFechar) {
    const html = '<div class="folha"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>' + NOME_DA_BIBLIOTECA + '</h2><p>Cada mec\xE2nica do jogo \xE9 um conceito de aprendizado de m\xE1quina. Os verbetes aparecem destacados quando acontecem na mesa, e a ajuda de cada a\xE7\xE3o leva ao verbete dela.</p><div class="grimorio"><nav class="grimorio-lista" id="g-lista"></nav><article class="grimorio-verbete" id="g-verbete"></article></div></div>';
    const painel = abrirPainel(html, { fechaAoClicarFora: true, aoFechar });
    const lista = painel.elemento.querySelector("#g-lista");
    const artigo = painel.elemento.querySelector("#g-verbete");
    function desenharLista(ativo) {
      lista.innerHTML = VERBETES.map((v) => '<button data-id="' + v.id + '" aria-current="' + (v.id === ativo) + '">' + escaparHtml(v.titulo) + (app.progresso.lidos[v.id] ? '<span class="lido">lido</span>' : "") + "</button>").join("");
      lista.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => mostrar(b.dataset.id)));
    }
    function mostrar(id) {
      const v = VERBETES.find((x) => x.id === id) || VERBETES[0];
      app.marcarVerbeteLido(v.id);
      artigo.innerHTML = '<div class="categoria">' + escaparHtml(v.categoria) + "</div><h2>" + escaparHtml(v.titulo) + "</h2>" + htmlDoVerbete(v);
      artigo.scrollTop = 0;
      desenharLista(v.id);
    }
    mostrar(idInicial || VERBETES[0].id);
    return painel;
  }

  // src/interface/telas/regras.js
  var AMOSTRA = {
    classico: { valor: "K", naipe: "C" },
    truco: { valor: "4", naipe: "P" },
    nobreza: { valor: "K", naipe: "E" },
    backprop: { valor: "Q", naipe: "C" },
    fraternidade: { valor: "Q", naipe: "O" },
    yinyang: { valor: "A", naipe: "E" },

  };
  var ABAS_DAS_REGRAS = [
    ["jogar", "Como jogar"],
    ["acoes", "A\xE7\xF5es"],
    ["pontuacao", "Pontua\xE7\xE3o"],
    ["extensoes", "Baralhos e terrenos"],
    ["dicas", "Dicas e estrat\xE9gias"]
  ];
  var COMO_JOGAR = '<p>De 2 a 5 jogadores disputam quem constr\xF3i a rede neural de maior soma. Cada coluna da mesa \xE9 uma <b>camada</b> e cada carta virada \xE9 um <b>neur\xF4nio</b>. A sua rede liga a camada de <b>entrada</b> \xE0 de <b>sa\xEDda</b> com um neur\xF4nio por camada, e cada rede tem a sua cor: a sua \xE9 <span class="selo azul">azul</span>.</p><h3>A mesa</h3><ul><li>Um baralho de 52 cartas, sem coringas (o menu deixa jogar com at\xE9 3 baralhos). Na arquitetura padr\xE3o ficam viradas 3 cartas na entrada, 5 em cada uma das 5 camadas ocultas e 4 na sa\xEDda; cada jogador al\xE9m do segundo acrescenta um neur\xF4nio por camada. O menu tem tamb\xE9m as arquiteturas curta, profunda e larga.</li><li>Cada jogador recebe 5 cartas na m\xE3o por baralho (10 no baralho Truco, que usa 2). Elas <b>n\xE3o s\xE3o repostas</b>: s\xE3o toda a sua muni\xE7\xE3o na m\xE3o.</li><li>As que sobram v\xE3o para o <b>limbo</b> sem ningu\xE9m ver (ru\xEDdo). S\xF3 voltam por transfer learning. Carta que vai para o <b>cemit\xE9rio</b> n\xE3o volta.</li><li>Entrada e sa\xEDda s\xE3o imunes: as a\xE7\xF5es com cartas s\xF3 valem nas camadas ocultas.</li></ul><h3>Quem come\xE7a</h3><p>Por padr\xE3o, cada jogador revela uma carta da m\xE3o e a mais forte come\xE7a (\xC1s, K, Q, J, 10 \u2026 2; no empate, o naipe: espadas, copas, paus, ouros). A carta revelada vai para o cemit\xE9rio; revele uma que voc\xEA n\xE3o pretende usar. O menu tamb\xE9m tem "revela e volta para a m\xE3o" e o sorteio.</p><h3>Sua vez</h3><p>O movimento normal \xE9 <b>avan\xE7ar</b>: clique num neur\xF4nio virado da pr\xF3xima camada da sua rede (eles ficam destacados). Ele \xE9 revelado e passa a ser seu; cada neur\xF4nio pertence a um s\xF3 jogador e as redes podem se cruzar. Em vez de avan\xE7ar, voc\xEA pode usar cartas da m\xE3o numa a\xE7\xE3o (aba A\xE7\xF5es).</p><p>Enquanto a sua rede estiver aberta voc\xEA \xE9 obrigado a jogar. <b>Passar</b> s\xF3 existe para quem teve a rede interrompida por early stop (do rival ou aplicado em si) e ainda tem cartas, ou para quem n\xE3o tem nenhuma jogada.</p><h3>Fim da m\xE3o e desempates</h3><p>Uma rede termina quando chega \xE0 sa\xEDda, quando sofre early stop ou stack overflow, ou quando n\xE3o sobra neur\xF4nio livre na pr\xF3xima camada. A m\xE3o acaba quando todas as redes terminam ou ningu\xE9m mais tem jogada. Vence a maior soma. No empate: menos dropouts; depois a maior soma das melhores cartas da m\xE3o; depois a carta mais alta da m\xE3o; depois o naipe dela; por fim, quem jogou primeiro. Nunca termina empatado.</p><h3>Truco</h3><p>Entre 2 jogadores, na partida at\xE9 12 tentos, cada m\xE3o vale 1. Na sua vez, pe\xE7a <b>TRUCO</b> (3). O outro aceita, corre (voc\xEA leva o valor atual) ou aumenta: SEIS, NOVE, DOZE. Com algu\xE9m a um tento da vit\xF3ria \xE9 <b>m\xE3o de onze</b> e ningu\xE9m truca. Com 3 ou mais jogadores o truco fica desligado e cada m\xE3o vale 1 tento.</p>';
  var PONTUACAO = '<table class="tabela-partida"><thead><tr><th>Carta</th><th>Pontos</th></tr></thead><tbody><tr><td>2 a 10</td><td>o n\xFAmero da carta</td></tr><tr><td>\xC1s</td><td>11</td></tr><tr><td>J, Q e K sozinhos</td><td>0</td></tr></tbody></table><h3>Figuras</h3><p>Figuras iguais em camadas vizinhas formam uma sequ\xEAncia, e as cartas empilhadas por tunagem contam nela. Cada figura da sequ\xEAncia vale 10:</p><table class="tabela-partida"><tbody><tr><td>Par (K e K lado a lado)</td><td>20</td></tr><tr><td>Trio</td><td>30</td></tr><tr><td>Quadra</td><td>a rede inteira vale 0 (<b>vanishing gradient</b>)</td></tr></tbody></table><p>Exemplo: a rede 8-K-K-3 vale 8 + 20 + 3 = 31. Com uma tunagem num dos Reis ela tem tr\xEAs Reis e soma 8 + (trio de Reis 30) + 3 = <b>41</b>. Tunar os dois Reis formaria uma quadra e zeraria a rede.</p><h3>Tunagem</h3><p>Cada carta empilhada no seu neur\xF4nio soma o valor dela \xE0 rede: um 6 sobre um 6 passa a valer 12. O selo \u26A1 mostra quantas cartas foram empilhadas, e o chip no canto de cada neur\xF4nio mostra quanto ele vale agora.</p><h3>Placar</h3><p>Clique no placar, \xE0 direita da mesa, para ver a soma de cada rede camada por camada, e no registro para ver todas as jogadas da m\xE3o. Baralhos e terrenos mudam a pontua\xE7\xE3o (pr\xF3xima aba).</p>';
  function abaDeAcoes() {
    return '<p>Selecione cartas da m\xE3o e acendem s\xF3 os bot\xF5es das jogadas poss\xEDveis com elas; passe o cursor num bot\xE3o para ler o efeito antes de confirmar. A carta usada precisa ter o mesmo valor da carta da mesa (o naipe n\xE3o importa), sempre sobre o \xFAltimo neur\xF4nio oculto de uma rede. As cartas usadas v\xE3o para o cemit\xE9rio.</p><table class="tabela-partida"><tbody>' + ACOES_DA_AJUDA.map((a) => "<tr><td><b>" + escaparHtml(a.nome) + "</b></td><td>" + escaparHtml(a.resumo) + "</td></tr>").join("") + '</tbody></table><div class="linha" style="margin-top:12px"><button class="botao" id="r-ajuda-acoes">Ajuda de cada a\xE7\xE3o</button></div>';
  }
  function abaDeExtensoes() {
    const baralhos = Object.entries(BARALHOS).map(([chave, b]) => '<div class="extensao"><div class="extensao-arte" data-baralho="' + chave + '"></div><div><b>' + escaparHtml(b.nome) + "</b><p>" + escaparHtml(b.resumo) + "</p></div></div>").join("");
    const terrenos = Object.entries(TERRENOS).map(([chave, t]) => '<div class="extensao"><div class="extensao-arte" data-terreno="' + chave + '"></div><div><b>' + escaparHtml(t.nome) + "</b><p>" + escaparHtml(t.resumo) + "</p></div></div>").join("");
    return '<h3>Baralhos</h3><div class="extensoes">' + baralhos + '</div><h3>Terrenos</h3><div class="extensoes">' + terrenos + "</div>";
  }
  var DICAS = "<ul><li><b>Guarde pares.</b> Duas cartas iguais na m\xE3o viram um early stop no momento certo.</li><li><b>Revele no in\xEDcio a carta mais solit\xE1ria</b>, a que n\xE3o tem par na m\xE3o.</li><li><b>Fique de olho no \xFAltimo neur\xF4nio de cada rival.</b> Se ele tiver o valor de uma carta sua, h\xE1 um ataque poss\xEDvel.</li><li><b>Figura sozinha vale 0.</b> Se a sua rede pegou uma, pense num dropout, ou tor\xE7a por outra figura igual na camada seguinte.</li><li><b>N\xE3o tune com duas cartas de uma vez:</b> a pilha chega a 3 e encerra a sua pr\xF3pria rede.</li><li><b>Leia o quadro de instru\xE7\xF5es</b>, \xE0 esquerda da mesa: ele diz o que voc\xEA pode fazer a cada vez.</li></ul><h3>Estrat\xE9gia e conceitos</h3><ul>" + DICAS_GERAIS.map((d) => {
    const v = VERBETES.find((x) => x.id === d.verbete);
    return "<li><b>" + escaparHtml(d.titulo) + ".</b> " + escaparHtml(d.texto) + (v ? ' <button class="link" data-verbete="' + v.id + '">' + escaparHtml(v.titulo) + "</button>" : "") + "</li>";
  }).join("") + "</ul><p>Ligue o modo dicas (bot\xE3o REGRAS da mesa) para receber uma dica de jogo a cada vez. M\xE3os jogadas com dicas n\xE3o contam para as conquistas.</p>";
  function desenharArte(raiz2) {
    raiz2.querySelectorAll(".extensao-arte:not([data-pronta])").forEach((caixa) => {
      caixa.setAttribute("data-pronta", "1");
      try {
        const telas = caixa.dataset.baralho ? [desenharVerso("mesa", 1.2, caixa.dataset.baralho), desenharCartaCompleta(AMOSTRA[caixa.dataset.baralho] || AMOSTRA.yinyang, caixa.dataset.baralho, 0.5)] : [desenharCartaDeTerreno(caixa.dataset.terreno, 0.5)];
        for (const tela of telas) {
          const img = document.createElement("img");
          img.alt = "";
          img.src = tela.toDataURL();
          caixa.appendChild(img);
        }
      } catch (e) {
      }
    });
  }
  function abrirRegras(app, aoFechar, abaInicial = "jogar") {
    const conteudo = { jogar: COMO_JOGAR, acoes: abaDeAcoes(), pontuacao: PONTUACAO, extensoes: abaDeExtensoes(), dicas: DICAS };
    const html = '<div class="folha regras"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Regras</h2><nav class="abas" role="tablist">' + ABAS_DAS_REGRAS.map(([id, nome]) => '<button role="tab" data-aba="' + id + '" aria-selected="' + (id === abaInicial) + '">' + nome + "</button>").join("") + "</nav>" + ABAS_DAS_REGRAS.map(([id]) => '<section class="aba" role="tabpanel" data-aba="' + id + '"' + (id === abaInicial ? "" : " hidden") + ">" + conteudo[id] + "</section>").join("") + '<p class="nota-regras">Os conceitos de redes neurais por tr\xE1s de cada jogada est\xE3o no ' + NOME_DA_BIBLIOTECA + '.</p><div class="linha fim" style="margin-top:14px"><button class="botao discreto" id="r-biblioteca">' + NOME_DA_BIBLIOTECA + '</button><button class="botao" data-fechar>Entendi</button></div></div>';
    if (app) {
      app.progresso.tutorialVisto = true;
      app.salvar();
    }
    const painel = abrirPainel(html, { fechaAoClicarFora: true, aoFechar });
    const raiz2 = painel.elemento;
    const mostrarAba = (id) => {
      raiz2.querySelectorAll(".abas [data-aba]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.aba === id)));
      raiz2.querySelectorAll("section.aba").forEach((s) => {
        s.hidden = s.dataset.aba !== id;
      });
      if (id === "extensoes") desenharArte(raiz2);
    };
    raiz2.querySelectorAll(".abas [data-aba]").forEach((b) => b.addEventListener("click", () => mostrarAba(b.dataset.aba)));
    mostrarAba(abaInicial);
    const appDaBiblioteca = app || { progresso: { lidos: {} }, marcarVerbeteLido() {
    } };
    raiz2.querySelector("#r-ajuda-acoes").addEventListener("click", () => abrirAjudaDasAcoes(appDaBiblioteca));
    raiz2.querySelector("#r-biblioteca").addEventListener("click", () => abrirGrimorio(appDaBiblioteca));
    raiz2.querySelectorAll("[data-verbete]").forEach((b) => b.addEventListener("click", () => abrirGrimorio(appDaBiblioteca, b.dataset.verbete)));
    return painel;
  }

    }).join("");
    const livres = AVATARES_DO_JOGADOR.filter((a) => avatarLiberado(a, p)).length;
    const html = '<div class="folha larga avatares"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Seu avatar</h2><p>O retrato que aparece no placar da mesa. ' + livres + " de " + AVATARES_DO_JOGADOR.length + ' liberados; os outros saem com conquistas.</p><div class="avatares-grade">' + itens + '</div><div class="linha fim" style="margin-top:14px"><button class="botao" data-fechar>Pronto</button></div></div>';
    const painel = abrirPainel(html, { fechaAoClicarFora: true });
    painel.elemento.querySelectorAll(".avatar-opcao").forEach((b) => b.addEventListener("click", () => {
      const avatar = AVATARES_DO_JOGADOR.find((a) => a.id === b.dataset.avatar);
      if (!avatarLiberado(avatar, app.progresso)) return;
      app.progresso.avatar = avatar.id;
      app.salvar();
      registrarEvento(EVENTOS.avatar, { avatar: avatar.id });
      if (app.atualizarJogadorNasEstatisticas) app.atualizarJogadorNasEstatisticas();
      painel.elemento.querySelectorAll(".avatar-opcao").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      if (aoMudar) aoMudar(avatar.id);
    }));
    return painel;
  }

  // src/arte/retrato.js
  function caminhoArredondado2(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function arcoGotico(ctx, x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + w * 0.55);
    ctx.quadraticCurveTo(x, y, x + w / 2, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + w * 0.55);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
  }
  function dourado(ctx, x0, y0, x1, y1) {
    let g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, "#fff3c4");
    g.addColorStop(0.25, "#d6a23a");
    g.addColorStop(0.5, "#fff1b0");
    g.addColorStop(0.75, "#a87516");
    g.addColorStop(1, "#f6dc8f");
    return g;
  }
  function desenharRetratoEmMoldura(src, S, nome, titulo, pronto) {
    let W = 240, H = 330;
    let c = document.createElement("canvas");
    c.width = Math.round(W * S);
    c.height = Math.round(H * S);
    let ctx = c.getContext("2d");
    ctx.scale(S, S);
    let img = new Image();
    img.onload = function() {
      let stone = ctx.createLinearGradient(0, 0, 0, H);
      stone.addColorStop(0, "#5b4a36");
      stone.addColorStop(1, "#2c2116");
      ctx.fillStyle = stone;
      caminhoArredondado2(ctx, 6, 14, W - 12, H - 40, 14);
      ctx.fill();
      ctx.strokeStyle = "#0d0a08";
      ctx.lineWidth = 2;
      ctx.stroke();
      let ax = 30, ay = 30, aw = W - 60, ah = 214;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      arcoGotico(ctx, ax - 14, ay - 14, aw + 28, ah + 28);
      ctx.fillStyle = dourado(ctx, ax, ay, ax + aw, ay + ah);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 1.6;
      arcoGotico(ctx, ax - 14, ay - 14, aw + 28, ah + 28);
      ctx.stroke();
      ctx.fillStyle = "#fff6c8";
      for (let i = 0; i < 26; i++) {
        let t = i / 25, px, py;
        if (t < 0.3) {
          px = ax - 7;
          py = ay + ah - t / 0.3 * (ah - aw * 0.45);
        } else if (t > 0.7) {
          px = ax + aw + 7;
          py = ay + aw * 0.45 + (t - 0.7) / 0.3 * (ah - aw * 0.45);
        } else {
          let a = Math.PI + (t - 0.3) / 0.4 * Math.PI;
          px = ax + aw / 2 + Math.cos(a) * (aw / 2 + 7);
          py = ay + aw * 0.5 + Math.sin(a) * (aw * 0.5 + 7);
        }
        ctx.beginPath();
        ctx.arc(px, py, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.save();
      arcoGotico(ctx, ax, ay, aw, ah);
      ctx.clip();
      let side = Math.min(img.width, img.height);
      let scale = Math.max(aw / side, ah / side);
      let dw = side * scale, dh = side * scale;
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, ax + (aw - dw) / 2, ay + (ah - dh) / 2 + 6, dw, dh);
      let v = ctx.createRadialGradient(ax + aw / 2, ay + ah * 0.45, ah * 0.25, ax + aw / 2, ay + ah / 2, ah * 0.75);
      v.addColorStop(0, "rgba(60,30,0,0)");
      v.addColorStop(1, "rgba(40,20,0,.55)");
      ctx.fillStyle = v;
      ctx.fillRect(ax, ay, aw, ah);
      ctx.restore();
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 2;
      arcoGotico(ctx, ax, ay, aw, ah);
      ctx.stroke();
      ctx.save();
      ctx.translate(W / 2, ay - 12);
      ctx.fillStyle = "#7a1626";
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-14, -12);
      ctx.lineTo(14, -12);
      ctx.lineTo(14, 2);
      ctx.quadraticCurveTo(14, 14, 0, 18);
      ctx.quadraticCurveTo(-14, 14, -14, 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#f2c94c";
      ctx.lineWidth = 1.2;
      [[-7, -5], [0, -5], [7, -5], [-4, 4], [4, 4]].forEach(function(p, k, arr) {
        if (k < 3) {
          ctx.beginPath();
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(-4, 4);
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(4, 4);
          ctx.stroke();
        }
      });
      ctx.fillStyle = "#4aa3df";
      [[-7, -5], [0, -5], [7, -5]].forEach(function(p) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "#f59322";
      [[-4, 4], [4, 4]].forEach(function(p) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
      let ry = ay + ah + 20;
      ctx.fillStyle = "#5a0e1a";
      ctx.beginPath();
      ctx.moveTo(4, ry - 4);
      ctx.lineTo(24, ry - 4);
      ctx.lineTo(24, ry + 22);
      ctx.lineTo(4, ry + 22);
      ctx.lineTo(12, ry + 9);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W - 4, ry - 4);
      ctx.lineTo(W - 24, ry - 4);
      ctx.lineTo(W - 24, ry + 22);
      ctx.lineTo(W - 4, ry + 22);
      ctx.lineTo(W - 12, ry + 9);
      ctx.closePath();
      ctx.fill();
      let rib = ctx.createLinearGradient(0, ry - 8, 0, ry + 28);
      rib.addColorStop(0, "#c0303e");
      rib.addColorStop(1, "#7a1626");
      ctx.fillStyle = rib;
      ctx.strokeStyle = "#2a0508";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(18, ry - 10);
      ctx.quadraticCurveTo(W / 2, ry - 18, W - 18, ry - 10);
      ctx.lineTo(W - 18, ry + 18);
      ctx.quadraticCurveTo(W / 2, ry + 10, 18, ry + 18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff1c8";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let fs = 15;
      ctx.font = "700 " + fs + "px Cinzel, Georgia, serif";
      while (ctx.measureText(nome).width > W - 60 && fs > 9) {
        fs -= 0.5;
        ctx.font = "700 " + fs + "px Cinzel, Georgia, serif";
      }
      ctx.fillText(nome, W / 2, ry + 1);
      ctx.fillStyle = "#e8d6a8";
      ctx.font = "italic 500 11.5px Spectral, Georgia, serif";
      ctx.fillText(titulo, W / 2, ry + 36);
      pronto(c);
    };
    img.src = src;

  // src/interface/telas/conquistas.js
  function medalhaHtml(conquista, desbloqueada) {
    const cor = GRADUACOES[conquista.graduacao].cor;
    return '<div class="medalha" style="--graduacao:' + cor + '">' + (ICONES_CONQUISTAS[conquista.id] || "") + (desbloqueada ? "" : '<span class="cadeado">' + ICONE_CADEADO + "</span>") + "</div>";
  }
  function itemHtml(conquista, desbloqueada) {
    return '<div class="conquista' + (desbloqueada ? "" : " bloqueada") + '">' + medalhaHtml(conquista, desbloqueada) + '<div><span class="graduacao">' + GRADUACOES[conquista.graduacao].nome + "</span><b>" + escaparHtml(conquista.nome) + "</b><small>" + escaparHtml(conquista.descricao) + "</small></div></div>";
  }
  function abrirConquistas(app) {
    const p = app.progresso;
    const total = CONQUISTAS.filter((c) => p.desbloqueadas[c.id]).length;
    const html = '<div class="folha larga"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><div class="conquistas-salao"><aside class="guilda"><div class="retrato" id="c-retrato" role="img" aria-label="Retrato do prof. Peng Yaohao em moldura medieval"></div><p class="guilda-nota">Guardi\xE3o do sal\xE3o das conquistas. Cada medalha aqui foi conquistada contra os oponentes da mesa.</p></aside><div class="conquistas-principal"><h2>Conquistas</h2><p class="conquistas-resumo"><b>' + total + "</b> de " + CONQUISTAS.length + " desbloqueadas \xB7 " + p.vitorias + " m\xE3os vencidas \xB7 " + p.dropouts + ' dropouts</p><div class="conquistas-lista">' + CONQUISTAS.map((c) => itemHtml(c, !!p.desbloqueadas[c.id])).join("") + '</div><p class="conquistas-rodape">Contam nas partidas contra os oponentes do computador. Algumas liberam avatares novos. <button class="link" id="c-avatares">Escolher avatar</button></p></div></div></div>';
    const painel = abrirPainel(html, { fechaAoClicarFora: true });
    painel.elemento.querySelector("#c-avatares").addEventListener("click", () => abrirAvatares(app));
    const densidade = Math.min(3, Math.max(2, globalThis.devicePixelRatio || 1));
    desenharRetratoEmMoldura(FOTO_PROFESSOR, densidade, "Prof. Peng Yaohao", "Gr\xE3o-mestre da guilda", (canvas) => {
      painel.elemento.querySelector("#c-retrato")?.appendChild(canvas);
    });
    return painel;
  }

  // src/versao.js
  var VERSAO = "2.4.7";
  var DATA_DA_VERSAO = "2026-11-14";

  // src/interface/telas/sobre.js
  function situacaoDasEstatisticas() {
    if (!podeMedir()) return "Nesta c\xF3pia do jogo (fora do site publicado) nada \xE9 medido.";
    const escolha = consentimento();
    return escolha === "sim" ? "Neste aparelho: ligadas." : escolha === "nao" ? "Neste aparelho: desligadas." : "Neste aparelho: ainda sem escolha.";

  function abrirSobre() {
    const html = '<div class="folha sobre"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Sobre o jogo</h2><p class="versao">Vers\xE3o ' + VERSAO + " \xB7 " + DATA_DA_VERSAO.split("-").reverse().join("/") + ' \xB7 <a href="https://github.com/welyngton/truco-de-turing/blob/main/CHANGELOG.md" target="_blank" rel="noopener">hist\xF3rico de vers\xF5es</a></p><p>Um jogo de cartas para navegador que ensina redes neurais jogando. Cada carta \xE9 um neur\xF4nio, cada m\xE3o \xE9 uma rede constru\xEDda da entrada \xE0 sa\xEDda, e cada a\xE7\xE3o com as cartas (tunagem, overfit, dropout, early stop, transfer learning) \xE9 um conceito do treino de modelos. Entre dois jogadores, o truco fica por cima de tudo: tentos, pedidos de TRUCO, SEIS, NOVE e DOZE, e blefe.</p><h3>Dois jogos que viraram um</h3><p>A turma fez dois jogos para o mesmo tema, e o professor decidiu juntar o melhor de cada um:</p><ul><li><b>NeuroDeck</b> (<a href="https://neurodeck-fpo.web.app/" target="_blank" rel="noopener">neurodeck-fpo.web.app</a>): as <b>regras</b>. O motor do NeuroDeck decide tudo o que acontece na mesa: jogadas, pontua\xE7\xE3o, terrenos, desempates, as arquiteturas de rede, de 2 a 5 jogadores, os oponentes do computador e a API de mods.</li><li><b>Truco de Turing</b>: a <b>interface</b>. Arte das cartas, menu, mesa, efeitos, sons, m\xFAsica, avatares, conquistas, o Gloss\xE1rio e o modo truco.</li></ul><p>O motor do NeuroDeck foi copiado para o projeto sem altera\xE7\xF5es e conferido contra o site publicado em 1.000 partidas; depois recebeu as decis\xF5es de regra do professor e do grupo, registradas no reposit\xF3rio.</p><h3>A disciplina</h3><p>Trabalho do tema 4 da disciplina Fundamentos em Pesquisa Operacional (FPO), semestre 2026/2, no Programa de P\xF3s-Gradua\xE7\xE3o em Computa\xE7\xE3o Aplicada (PPCA) da Universidade de Bras\xEDlia, com o prof. Peng Yaohao. O tema pede um jogo indie para ensinar conceitos de machine learning e redes neurais, a partir de uma premissa: um jogo educativo precisa, antes de tudo, ser um jogo divertido. Se o jogo for divertido e o docente tiver compet\xEAncia suficiente, ele pode se tornar educativo.</p><h3>As regras originais</h3><ul><li>Mesa com um baralho de 52 cartas: 3 neur\xF4nios na entrada, 5 camadas ocultas de 5 neur\xF4nios e 4 na sa\xEDda. Cada jogador recebe 5 cartas; as 10 restantes v\xE3o para o limbo, como ru\xEDdo.</li><li>Os jogadores se alternam ativando neur\xF4nios para ligar a entrada \xE0 sa\xEDda. Vence a rede de maior soma: 2 a 10 pelo valor, \xC1s 11, figuras 0, com figuras iguais vizinhas valendo 10 cada (par 20, trio 30) e quadras zerando a rede (vanishing gradient).</li><li>A\xE7\xF5es com a m\xE3o: tunagem, overfit, early stop, stack overflow, dropout (o GatoNet) e transfer learning. Entrada e sa\xEDda s\xE3o imunes.</li><li>Desempates em cascata e tr\xEAs formas de decidir quem come\xE7a.</li><li>Extens\xF5es propostas: baralhos com efeitos (truco, fraternidade, yin-yang, Power BI), terrenos (montanha, p\xE2ntano, oceano), coringas e conquistas em gradua\xE7\xF5es de bronze a antimat\xE9ria.</li><li>Inspira\xE7\xF5es citadas: TensorFlow Playground, Balatro, Magic: The Gathering e Geometry Dash.</li></ul><h3>O professor</h3><p><b>Peng Yaohao</b> \xE9 professor da Universidade de Bras\xEDlia, mestre e doutor pela UnB na \xE1rea de Finan\xE7as e M\xE9todos Quantitativos. Pesquisa aprendizado de m\xE1quina, modelos n\xE3o lineares e econometria financeira, com trabalhos sobre previs\xE3o de volatilidade e de pre\xE7os de a\xE7\xF5es e um estudo emp\xEDrico sobre n\xE3o linearidade e overfitting em machine learning com dados da COVID-19.</p><h3>Autores</h3><ul class="autores"><li><b>Francisco Lima</b>: NeuroDeck (regras, motor, oponentes e mods).</li><li><b>Welyngton Jos\xE9 Vinicius Dal Pr\xE1</b>: Truco de Turing (interface, arte, sons, conquistas e modo truco).</li><li><b>Diego Casagrande</b>: testes, valida\xE7\xE3o das regras e fus\xE3o dos dois jogos.</li   var COLUNAS = [3, 5, 5, 5, 4];
  var CenaMenu = class extends Phaser.Scene {
    constructor() {
      super("Menu");
    }
    create() {
      ajustarCamera(this);
      colocarFundo(this);
      this.rede = this.add.graphics();
      this.pontos = COLUNAS.map((n, c) => Array.from({ length: n }, (_, i) => ({ x: 120 + c * 260, y: 360 + (i - (n - 1) / 2) * 120 })));
      this.espalharCartas();
      fecharTodos();
      abrirMenu(Aplicacao);
      this.tocarMusicaDoMenu();
    }
    /**
     * Trilha do menu. O navegador só libera som depois de um gesto: se ainda não liberou, a música
     * começa no primeiro toque ou clique na página (sem pedir nada à pessoa).
     */
    tocarMusicaDoMenu() {
      if (!Aplicacao.progresso.musica) return;
      if (Som.liberado()) {
        Musica.tocar("menu");
        return;
      }
      const aoTocar = () => {
        document.removeEventListener("pointerdown", aoTocar, true);
        if (!this.sys.isActive() || !Aplicacao.progresso.musica) return;
        Som.desbloquear();
        Musica.tocar("menu");
      };
      document.addEventListener("pointerdown", aoTocar, true);
      this.events.once("shutdown", () => document.removeEventListener("pointerdown", aoTocar, true));
    }
    /** Nove cartas semitransparentes flutuando devagar. */
    espalharCartas() {
      const cartas = embaralhar(BARALHOS.classico.montar(), { semente: 99 });
      const sorteio = Phaser.Math.Between;
      for (const carta of cartas.slice(0, 9)) {
        const imagem = this.add.image(sorteio(60, 1220), sorteio(60, 660), texturaDaCartaNaMesa(this, carta, "classico")).setDisplaySize(68, 95).setAlpha(0.28).setAngle(sorteio(-25, 25));
        this.tweens.add({ targets: imagem, y: imagem.y - sorteio(20, 60), angle: imagem.angle + sorteio(-10, 10), duration: sorteio(3e3, 6e3), yoyo: true, repeat: -1, ease: "Sine.inOut" });
      }
    }
    /** Redesenha a rede com conexões que pulsam (azul e laranja, como no TensorFlow Playground). */
    update(tempo) {
      const g = this.rede;
      g.clear();
      const p = this.pontos;
      for (let c = 0; c < p.length - 1; c++) {
        p[c].forEach((a, i) => {
          p[c + 1].forEach((b, j) => {
            const espessura = 0.5 + 2.5 * Math.abs(Math.sin(i * 1.7 + j * 2.3 + c + tempo / 2400));
            g.lineStyle(espessura, (i + j + c) % 2 ? CORES.j0 : CORES.j1, 0.18);
            g.lineBetween(a.x, a.y, b.x, b.y);
          });
        });
      }
      for (const coluna of p) for (const ponto of coluna) {
        g.fillStyle(14266976, 0.25);
        g.fillCircle(ponto.x, ponto.y, 9);
      }
    }
  };

  var metodosOnline = {
    /** Liga a cena à sala (se a partida for online). Chamado no início de `create`. */
    prepararOnline() {
      const online = this.app.online;
      this.online = online || null;
      if (!online) return;
      this.filaOnline = [];
      this.aguardandoRede = false;
      this.partidasOnline = 0;
      const sala = online.sala;
      const aoReceber = (acao) => {
        this.filaOnline.push(acao);
        this.processarFilaOnline();
      };
      const aoAvisar = (texto) => mostrarAviso("Sala " + sala.config.codigo, texto, null, 5e3);
      sala.on("acao", aoReceber).on("aviso", aoAvisar);
      this.events.once("shutdown", () => {
        sala.off("acao", aoReceber).off("aviso", aoAvisar);
      });
    },
    /** Cadeira deste aparelho na sala. */
    cadeiraOnline() {
      return this.online.sala.minhaCadeira;
    },
    /** Este aparelho joga pelos oponentes do computador? */
    souAnfitriaoOnline() {
      return !!this.online && this.online.sala.souAnfitriao;
    },
    /** Identifica a mão atual (partida e número da mão), para separar as ações de cada mão. */
    chaveDaMao() {
      return this.partidasOnline + ":" + this.partida.numeroMao;
    },
    /** Semente da mão atual: a mesma em todos os aparelhos. */
    sementeDaMao() {
      return this.online.sala.config.semente + this.partidasOnline * 1e3 + this.partida.numeroMao >>> 0;
    },
    /** Jogadores da partida online: as pessoas pelo nome, as outras cadeiras com o perfil escolhido. */
    jogadoresOnline() {
      const perfil = this.opcoes.oponente, cadeiras = this.online.sala.config.cadeiras;
      const bots = cadeiras.filter((c) => c.tipo !== "humano").length;
      let k = 0;
      return cadeiras.map((c, j) => {
        if (c.tipo === "humano") return { nome: j === this.cadeiraOnline() ? c.nome + " (voc\xEA)" : c.nome, tipo: "humano" };
        k++;
        return { nome: c.saiu ? c.saiu + " (computador)" : OPONENTES[perfil].nome + (bots > 1 ? " " + k : ""), tipo: "oponente", oponente: perfil };
      });
    },
    /** Manda uma ação deste aparelho para a sala e espera ela voltar numerada. */
    enviarOnline(acao) {
      this.online.sala.enviar({ ...acao, mao: this.chaveDaMao() });
      this.ocupada = true;
      this.esperarRede();
    },
    /** A mesa para e espera a próxima ação da sala. */
    esperarRede() {
      this.aguardandoRede = true;
      this.redesenhar();
      this.processarFilaOnline();
    },
    /** Aplica a próxima ação da fila, se a mesa estiver esperando e a ação for da mão atual. */
    processarFilaOnline() {
      if (!this.online || !this.aguardandoRede || !this.mao || this.encerrada) return;
      while (this.filaOnline.length) {
        const acao = this.filaOnline[0];
        if (acao.tipo === "substituir") {
          this.filaOnline.shift();
          this.aplicarSubstituicao(acao);
          continue;
        }
        if (acao.mao !== this.chaveDaMao()) {
          const [p, m] = acao.mao.split(":").map(Number), [pa, ma] = this.chaveDaMao().split(":").map(Number);
          if (p < pa || p === pa && m < ma) {
            this.filaOnline.shift();
            continue;
          }
          return;
        }
        this.filaOnline.shift();
        this.aguardandoRede = false;
        if (acao.tipo === "jogada") this.executarJogada(acao.jogada, true);
        else if (acao.tipo === "truco") this.anunciarTruco(acao.cadeira, true);
        else if (acao.tipo === "resposta") this.aplicarResposta(acao.cadeira, acao.resposta, true);
        return;
      }
    },
    /** Alguém caiu: a cadeira passa para um oponente do computador nesta mão e nas próximas. */
    aplicarSubstituicao(acao) {
      const jogador = this.mao.jogadores[acao.cadeira];
      if (jogador && jogador.tipo === "humano") {
        Object.assign(jogador, { tipo: "oponente", oponente: this.opcoes.oponente, nome: (acao.nome || jogador.nome) + " (computador)" });
        mostrarAviso("Sala " + this.online.sala.config.codigo, (acao.nome || "Um jogador") + " saiu; o computador joga no lugar.", null, 5e3);
      }
      this.redesenhar();
      const mao = this.mao, pedido = this.partida.pedido;
      const esperavaEla = mao.fase === "inicio" || (pedido ? 1 - pedido.por === acao.cadeira : mao.vez === acao.cadeira);
      if (this.souAnfitriaoOnline() && this.aguardandoRede && mao.fase !== "fim" && esperavaEla) {
        this.aguardandoRede = false;
        this.time.delayedCall(50, () => this.partida.pedido ? this.pedirResposta() : this.avancar());
      }
    },
    /**
     * Escolha de quem começa, online: o anfitrião manda a carta dos oponentes do computador (uma
     * vez por mão); este aparelho escolhe a própria carta; os outros escolhem nas telas deles.
     * Quando todos escolheram, as cartas aparecem juntas, como na partida local.
     */
    avancarNoInicioOnline() {
      const mao = this.mao, eu = this.cadeiraOnline();
      this.quemVe = eu;
      if (this.souAnfitriaoOnline()) {
        mao.jogadores.forEach((jogador, j) => {
          if (jogador.tipo !== "oponente" || jogador.cartaInicial || this.inicioDosBotsEnviado.has(j)) return;
          this.inicioDosBotsEnviado.add(j);
          this.online.sala.enviar({ tipo: "jogada", cadeira: j, jogada: escolherJogada(mao, j), mao: this.chaveDaMao() });
        });
      }
      if (mao.jogadores[eu].tipo === "humano" && !mao.jogadores[eu].cartaInicial && this.modo !== "inicio") {
        this.modo = "inicio";
        this.ocupada = false;
        this.redesenhar();
      }
      this.esperarRede();
    },
    /**
     * Vez de alguém que não é este aparelho: o anfitrião joga pelos oponentes do computador; nos
     * outros casos, a mesa espera a ação chegar pela sala.
     * @returns {boolean} true se a vez foi tratada aqui.
     */
    avancarOnline() {
      const mao = this.mao, vez = mao.vez, jogador = mao.jogadores[vez];
      this.quemVe = this.cadeiraOnline();
      if (jogador.tipo === "oponente") {
        if (this.souAnfitriaoOnline()) this.vezDoOponente();
        else {
          this.ocupada = true;
          this.esperarRede();
        }
        return true;
      }
      if (vez !== this.cadeiraOnline()) {
        this.ocupada = true;
        this.esperarRede();
        return true;
      }
      return false;
    }
  };

  // src/cenas/mesa/CenaMesa.js
  var CenaMesa = class extends Phaser.Scene {
    constructor() {
      super("Mesa");
    }
    /** Monta a mesa e começa a primeira mão (depois das regras, na primeira visita). */
    create() {
      this.app = Aplicacao;
      this.prepararOnline();
      this.opcoes = normalizarOpcoes(this.online ? this.online.sala.config.opcoes : this.app.opcoes);
      this.numJogadores = this.opcoes.jogadores;
      this.humanos = this.online ? 1 : this.opcoes.humanos;
      this.variosHumanos = !this.online && this.humanos > 1;
      definirMesa(tamanhosDaMesa(this.opcoes.arquitetura, this.numJogadores));
      this.partida = novaPartida(this.opcoes.alvo, this.numJogadores);
      this.mao = null;
      ajustarCamera(this);
      colocarFundo(this, this.opcoes.terreno);
      carregarIconesDasAcoes(this);
      this.criarAmbiente(this.opcoes.terreno);
      this.desenharCenarioFixo();
      this.camadaVazios = this.add.graphics().setDepth(1);
      this.camadaConexoes = this.add.graphics().setDepth(2);
      this.camadaDestaques = this.add.graphics().setDepth(5);
      this.camadaCurva = this.add.graphics().setDepth(6);
      this.camadaVez = this.add.graphics().setDepth(6);
      this.camadaSelecao = this.add.graphics().setDepth(11);
      this.criarPaineis();
      this.input.keyboard?.on("keydown-ESC", () => this.cancelarSelecao());
      this.events.once("shutdown", () => {
        this.encerrada = true;
        esconderDicaFlutuante();
        Musica.parar();
      });
      this.historicoDaPartida = [];
      if (this.app.progresso.musica) Musica.tocar(this.opcoes.terreno);
      const comecar = () => this.iniciarMao();
      if (!this.app.progresso.tutorialVisto) abrirRegras(this.app, comecar);
      else comecar();
    }
    /** A cada quadro: conexões animadas, contornos pulsantes e o destaque de quem está na vez. */
    update(tempo) {
      this.atualizarAmbiente(tempo);
      if (!this.mao) return;
      this.desenharConexoesEAlvos(tempo);
      this.desenharDestaqueDaVez(tempo);
    }
  };
  Object.assign(
    CenaMesa.prototype,
    metodosDoCenario,
    metodosDeDesenho,
    metodosDeEntrada,
    metodosDeTurnos,
    metodosDoTruco,
    metodosDeEfeitos,
    metodosDoResultado,
    metodosDeDicas,
    metodosDosPaineis,
    metodosDoAmbiente,
    metodosOnline
  );

  // src/principal.js
  var celularEmPe = globalThis.matchMedia ? matchMedia("(orientation: portrait) and (max-width: 600px)") : null;
  var TOQUES_SIMULTANEOS = 4;
  function remedirAposMudarATela() {
    for (const espera of [50, 250, 600, 1200]) {
      setTimeout(() => {
        if (Aplicacao.jogo) Aplicacao.jogo.scale.refresh();
      }, espera);
    }
  }
  function criarJogo() {
    Aplicacao.jogo = new Phaser.Game({
      type: FORCAR_CANVAS ? Phaser.CANVAS : Phaser.AUTO,
      parent: "jogo",
      width: Math.round(MUNDO.largura * RESOLUCAO),
      height: Math.round(MUNDO.altura * RESOLUCAO),
      backgroundColor: "#06180f",
      scale: { mode: Phaser.Scale.EXPAND, autoCenter: Phaser.Scale.CENTER_BOTH },
      render: { antialias: true, roundPixels: false },
      /* cliques nos painéis HTML não vazam para o canvas. Vários toques simultâneos: em tela cheia
       * o polegar que segura o celular costuma encostar na borda da tela, e com um só ponteiro
       * de toque o Phaser ignorava o toque seguinte (nos botões de ação). */
      input: { windowEvents: false, activePointers: TOQUES_SIMULTANEOS },
      scene: [CenaCarregamento, CenaMenu, CenaMesa]
    });
    document.addEventListener("fullscreenchange", remedirAposMudarATela);
    document.addEventListener("webkitfullscreenchange", remedirAposMudarATela);
    globalThis.screen?.orientation?.addEventListener?.("change", remedirAposMudarATela);
  }
  function iniciarJogo() {
    if (Aplicacao.jogo) return;
    if (!celularEmPe || !celularEmPe.matches) return criarJogo();
    const aoGirar = () => {
      if (celularEmPe.matches) return;
      removeEventListener("resize", aoGirar);
      removeEventListener("orientationchange", aoGirar);
      setTimeout(iniciarJogo, 150);
    };
    addEventListener("resize", aoGirar);
    addEventListener("orientationchange", aoGirar);
  }
  prepararTextoNitido();
  Aplicacao.iniciar();
  iniciarJogo();
  retomarConta(Aplicacao);
  iniciarAnalise();
  globalThis.__TRUCO_DE_TURING__ = Aplicacao;
})();

</script>
